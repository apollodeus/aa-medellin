name: Update directory

on:
  schedule:
    - cron: "17 9 * * *"   # daily, 04:17 Colombia
  workflow_dispatch:
  push:
    paths: ["manual.json", "venues.json", "overrides.json", "site.json", "template.html", "scripts/**"]

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Rebuild from the sources
        env:
          GOOGLE_GEOCODING_KEY: ${{ secrets.GOOGLE_GEOCODING_KEY }}
        run: python3 scripts/build.py
      - name: Commit if changed
        run: |
          git config user.name "aa-medellin-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A data.json index.html en llms.txt sitemap.xml robots.txt CNAME geocache.json report.md
          if ! git diff --cached --quiet; then
            git commit -m "data: refresh $(date -u +%F)"
            git push
          else
            echo "No changes."
          fi
      - name: Report
        run: |
          cat report.md >> "$GITHUB_STEP_SUMMARY"
          python3 scripts/check.py
