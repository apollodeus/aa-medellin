<!doctype html>
<html lang="{{LANG}}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>{{TITLE}}</title>
<link rel="icon" type="image/svg+xml" href="{{SITE}}/assets/icon.svg">
<link rel="icon" type="image/png" sizes="32x32" href="{{SITE}}/assets/favicon-32.png">
<link rel="apple-touch-icon" href="{{SITE}}/assets/apple-touch-icon.png">
<meta name="theme-color" content="#1d3461">
<meta name="description" content="{{DESC}}">
<link rel="canonical" href="{{CANONICAL}}">
<link rel="alternate" hreflang="es" href="{{SITE}}{{ES_PATH}}">
<link rel="alternate" hreflang="en" href="{{SITE}}{{EN_PATH}}">
<link rel="alternate" hreflang="x-default" href="{{SITE}}{{ES_PATH}}">
<meta property="og:type" content="article">
<meta property="og:title" content="{{TITLE}}">
<meta property="og:description" content="{{DESC}}">
<meta property="og:url" content="{{CANONICAL}}">
<meta property="og:locale" content="{{OGLOCALE}}">
<meta property="og:image" content="{{SITE}}/assets/og-image.png">
<meta property="og:site_name" content="AA Medellín Map">
<meta name="twitter:card" content="summary_large_image">
<script type="application/ld+json">{{JSONLD}}</script>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,600;8..60,700&family=Source+Sans+3:wght@400;600;700&display=swap">
<style>
:root{
  --navy:#1d3461; --navy-deep:#14244a; --gold:#a8791f; --gold-hi:#d9ad4f; --gold-soft:#f6ecd6;
  --bg:#f3f5f9; --panel:#ffffff; --fg:#18213a; --muted:#5a6479; --line:#dbe1ea; --tint:#eef2f9;
  --accent:#1d3461; --accent-soft:#e3e9f4; --shadow:0 1px 2px rgba(20,36,74,.06),0 4px 14px rgba(20,36,74,.07);
  --serif:"Source Serif 4",Georgia,"Times New Roman",serif;
  --sans:"Source Sans 3",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){:root{
  --bg:#0e1528; --panel:#162140; --fg:#e7ebf3; --muted:#9ca8c0; --line:#26345a; --tint:#1c2a50;
  --accent:#a9c2ee; --accent-soft:#22325c; --gold:#e0b85c; --gold-soft:#3a3120;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.25); color-scheme:dark}}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--fg);font:17px/1.6 var(--sans);-webkit-font-smoothing:antialiased}
.inner{max-width:760px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.band{background:var(--navy);background-image:radial-gradient(120% 140% at 85% 0%,#284783 0%,var(--navy) 45%,var(--navy-deep) 100%);color:#e9eef8;border-bottom:3px solid var(--gold-hi)}
.band .inner{padding-block:22px 38px}
.topbar{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:26px}
.brand{font:600 .78rem/1 var(--sans);letter-spacing:.16em;text-transform:uppercase;color:var(--gold-hi);display:flex;align-items:center;gap:10px;text-decoration:none}
.langsw{display:flex;gap:4px;font:600 .8rem/1 var(--sans);letter-spacing:.08em}
.langsw a,.langsw span{padding:7px 11px;border-radius:8px;color:#fff;text-decoration:none;border:1px solid rgba(255,255,255,.25)}
.langsw span{background:var(--gold-hi);color:var(--navy-deep);border-color:var(--gold-hi)}
h1{font:600 clamp(1.9rem,4.6vw,2.7rem)/1.1 var(--serif);margin:0 0 12px;color:#fff;letter-spacing:-.01em;text-wrap:balance}
.lead{font-size:1.1rem;max-width:62ch;margin:0;color:#d5deef}
main{padding:28px 0 10px}
h2{font:600 1.45rem/1.2 var(--serif);color:var(--accent);margin:34px 0 10px}
h2:first-child{margin-top:0}
p,li{max-width:68ch}
ul{padding-left:1.2em}
li{margin:6px 0}
a{color:var(--accent);text-underline-offset:3px}
.cta{display:inline-block;margin:10px 0 0;font:600 1rem var(--sans);background:var(--navy);color:#fff;text-decoration:none;border-radius:10px;padding:12px 20px;box-shadow:inset 0 -2px 0 var(--gold-hi)}
.cta:hover{filter:brightness(1.12)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:18px 20px;box-shadow:var(--shadow);margin:18px 0}
.card h2{margin-top:0}
.phrase{display:grid;grid-template-columns:1fr 1fr;gap:4px 16px;font-size:.98rem}
.phrase b{font-weight:600}
@media(max-width:560px){.phrase{grid-template-columns:1fr}.phrase b{margin-top:8px}}
.note{font-size:.9rem;color:var(--muted)}
.preamble{margin:14px 0 18px;padding:16px 20px;border-left:4px solid var(--gold-hi);background:var(--panel);border-radius:0 12px 12px 0;box-shadow:var(--shadow);font-family:var(--serif);font-size:1.08rem}
.preamble p{margin:0 0 10px}
.preamble footer{font:400 .8rem var(--sans);color:var(--muted);margin-top:6px}
footer{margin-top:40px;background:var(--navy-deep);color:#a9b8d6;border-top:3px solid var(--gold-hi)}
footer .inner{padding-block:22px}
footer a{color:var(--gold-hi)}
footer .note{color:#a9b8d6}
</style>
{{ANALYTICS}}
</head>
<body>
<div class="band"><div class="inner">
  <div class="topbar">
    <a class="brand" href="{{HOME}}"><img src="{{SITE}}/assets/icon.svg" width="26" height="26" alt="" style="border-radius:6px">AA Medellín Map</a>
    <nav class="langsw" aria-label="Language / Idioma">{{LANGSW}}</nav>
  </div>
  <h1>{{H1}}</h1>
  <p class="lead">{{LEAD}}</p>
</div></div>
<main><div class="inner">
{{BODY}}
</div></main>
<footer><div class="inner"><p class="note">{{NOTE}}</p></div></footer>
</body>
</html>
