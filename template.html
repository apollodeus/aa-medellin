<!doctype html>
<html lang="{{LANG}}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>{{TITLE}}</title>
<link rel="icon" href="data:,">
<meta name="description" content="{{DESC}}">
<link rel="canonical" href="{{CANONICAL}}">
<link rel="alternate" hreflang="es" href="{{SITE}}/">
<link rel="alternate" hreflang="en" href="{{SITE}}/en/">
<link rel="alternate" hreflang="x-default" href="{{SITE}}/">
<meta property="og:type" content="website">
<meta property="og:title" content="{{TITLE}}">
<meta property="og:description" content="{{DESC}}">
<meta property="og:url" content="{{CANONICAL}}">
<meta property="og:locale" content="{{OGLOCALE}}">
<meta name="twitter:card" content="summary">
<script type="application/ld+json">{{JSONLD}}</script>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css">
<style>
/* Layout: one column; real map on top, sticky filter bar, directory list. */
:root{
  --bg:#f6f4ef; --panel:#ffffff; --fg:#1d1f1a; --muted:#5f6457; --line:#dcd8cd;
  --accent:#1f5f8b; --accent-soft:#dbe7f0; --en:#8a5a1a; --en-soft:#f3e7d4;
  --sans:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root{
  --bg:#15171a; --panel:#1e2125; --fg:#e8e6df; --muted:#a2a69b; --line:#33373c;
  --accent:#7fb3d8; --accent-soft:#223544; --en:#d9a45e; --en-soft:#3a2e1c; color-scheme:dark}}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--fg);font:15px/1.45 var(--sans);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px 40px}
.wrap{max-width:900px;margin:0 auto}
header{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:6px}
h1{font-size:1.4rem;font-weight:600;margin:0;letter-spacing:-.01em}
.count{font-family:var(--mono);font-size:.85rem;color:var(--muted);font-variant-numeric:tabular-nums}
.src{font-size:.8rem;color:var(--muted);margin:0 0 10px}
.src a{color:var(--accent)}
#map{height:460px;border:1px solid var(--line);border-radius:8px;margin-bottom:6px;background:#e8eaed;overflow:hidden}
@media (max-width:600px){#map{height:360px}}
.hdr-r{display:flex;gap:14px;align-items:baseline}.langsw{font-size:.85rem;display:flex;gap:2px;border:1px solid var(--line);border-radius:999px;padding:2px}.langsw a,.langsw span{padding:3px 10px;border-radius:999px;text-decoration:none;color:var(--muted)}.langsw span{background:var(--accent);color:#fff;font-weight:600}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:.8rem;color:var(--muted);margin:0 0 10px}
.legend i{display:inline-block;width:11px;height:11px;border-radius:50%;margin-right:5px;vertical-align:-1px;border:2px solid #fff;box-shadow:0 0 0 1px rgba(0,0,0,.3)}
.iw{font:13px/1.4 var(--sans);color:#202124;max-width:240px}
.iw b{display:block;font-size:14px;margin-bottom:2px}
.iw .t{font-family:var(--mono);font-size:12px;margin:4px 0 6px;color:#3c4043}
.iw a{display:inline-block;margin-top:2px;margin-right:10px;color:#1a73e8;font-weight:600;text-decoration:none}
.maplibregl-popup{z-index:5}
.maplibregl-popup-content{border-radius:8px;padding:10px 12px;box-shadow:0 2px 10px rgba(0,0,0,.25)}
.dir{display:inline-flex;align-items:center;gap:6px;background:var(--accent);color:#fff!important;padding:6px 12px;border-radius:999px;text-decoration:none!important}
.dir:hover{filter:brightness(1.08)}
.addr a{color:inherit;text-decoration:underline;text-decoration-color:var(--line);text-underline-offset:3px}
.pin{width:16px;height:16px;border-radius:50%;border:2px solid #fff;box-shadow:0 1px 3px rgba(0,0,0,.45);cursor:pointer;transition:transform .12s}
.pin:hover,.pin.sel{transform:scale(1.35)}
.pin[data-n]::after{content:attr(data-n);position:absolute;top:-9px;right:-9px;background:#202124;color:#fff;font:600 9px/14px var(--sans);min-width:14px;height:14px;border-radius:7px;text-align:center}
.pin.es{background:#1a73e8}.pin.en{background:#ea8600;width:20px;height:20px}.pin.dim{opacity:.15!important;pointer-events:none}
.controls{position:sticky;top:0;z-index:500;background:var(--bg);padding-block:8px;display:grid;gap:8px;border-bottom:1px solid var(--line);margin-bottom:12px}
input[type=search],select{font:inherit;color:var(--fg);background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:8px 10px;width:100%;min-width:0}
input:focus,select:focus,button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.row>*{min-width:0}
.days{display:flex;gap:4px}
.chip{font:500 .8rem/1 var(--mono);padding:7px 0;flex:1 1 0;text-align:center;border:1px solid var(--line);background:var(--panel);color:var(--fg);border-radius:5px;cursor:pointer}
.chip[aria-pressed=true]{background:var(--accent);border-color:var(--accent);color:#fff}
.seg{display:flex;border:1px solid var(--line);border-radius:6px;overflow:hidden;flex:1 1 200px}
.seg button{flex:1;font:inherit;font-size:.85rem;padding:7px 6px;background:var(--panel);color:var(--fg);border:0;cursor:pointer;white-space:nowrap}
.seg button[aria-pressed=true]{background:var(--accent-soft);color:var(--accent);font-weight:600}
.seg.lang button[aria-pressed=true]{font-weight:600}
.sortwrap{display:flex;gap:6px;flex:1 1 220px;align-items:center;font-size:.85rem;color:var(--muted)}
.sortwrap select{flex:1}
.list{display:grid;gap:8px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:10px 12px;display:grid;gap:4px;scroll-margin-top:230px}
.card.sel{box-shadow:0 0 0 2px var(--accent) inset}
.card h2{font-size:1rem;font-weight:600;margin:0;display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.tag{font:500 .68rem/1 var(--mono);letter-spacing:.06em;text-transform:uppercase;padding:3px 6px;border-radius:4px;background:var(--accent-soft);color:var(--accent)}
.tag.en{background:var(--en-soft);color:var(--en)}
.tag.o{background:transparent;border:1px solid var(--line);color:var(--muted)}
.addr{color:var(--fg)}
.zone{color:var(--muted);font-size:.85rem}
.hor{font-family:var(--mono);font-size:.82rem;background:var(--bg);padding:6px 8px;border-radius:4px;word-break:break-word}
.notes{font-size:.85rem;color:var(--muted)}
.links{display:flex;gap:14px;font-size:.85rem;flex-wrap:wrap}
.links a{color:var(--accent);text-decoration:none;font-weight:500}
.links a:hover{text-decoration:underline}
.dist{font-family:var(--mono);font-size:.8rem;color:var(--muted);font-variant-numeric:tabular-nums;margin-left:auto}
.empty{color:var(--muted);padding:24px 0;text-align:center}
.intro{font-size:.95rem;max-width:65ch;margin:0 0 8px}
.sched{margin-top:20px}.sched h2{font-size:1.05rem;margin:0 0 6px}.sched table{border-collapse:collapse;width:100%;font-size:.88rem}.sched td,.sched th{border-top:1px solid var(--line);padding:6px 8px;text-align:left;vertical-align:top}.sched th{font-weight:600;white-space:nowrap}
.tw{overflow-x:auto}
.note{font-size:.78rem;color:var(--muted);margin-top:18px;line-height:1.5}
</style>
</head>
<body>
<div class="wrap">
<header>
  <h1>{{H1}}</h1>
  <span class="hdr-r"><nav class="langsw" aria-label="Language / Idioma">{{LANGSW}}</nav><span class="count" id="count">{{COUNT}}</span></span>
</header>
{{INTRO}}
<p class="src" id="src">{{SRC}} <span id="upd">{{UPDATED}}</span></p>

<div id="map" role="region" aria-label="{{T_MAP}}"></div>
<p class="legend"><span><i style="background:#ea8600"></i>{{T_LEG_EN}}</span><span><i style="background:#1a73e8"></i>{{T_LEG_ES}}</span></p>

<div class="controls">
  <div class="row">
    <div class="seg lang" id="lang" role="group" aria-label="{{T_LANG}}">
      <button aria-pressed="true" data-v="all">{{T_ALL}}</button>
      <button aria-pressed="false" data-v="es">Español</button>
      <button aria-pressed="false" data-v="en">English</button>
    </div>
    <input type="search" id="q" placeholder="{{T_SEARCH}}" autocomplete="off" style="flex:2 1 220px">
  </div>
  <div class="days" id="days" role="group" aria-label="{{T_DAY}}"></div>
  <div class="row">
    <div class="seg" id="fmt" role="group" aria-label="{{T_FMT}}">
      <button aria-pressed="true" data-v="all">{{T_ALLF}}</button>
      <button aria-pressed="false" data-v="p">{{T_INPERSON}}</button>
      <button aria-pressed="false" data-v="v">{{T_ONLINE}}</button>
    </div>
    <label class="sortwrap">{{T_NEAR}}
      <select id="center">
        <option value="pob">El Poblado (Parque Lleras)</option>
        <option value="cen">Centro (Parque Berrío)</option>
        <option value="lau">Laureles (Segundo Parque)</option>
        <option value="bel">Belén (Parque de Belén)</option>
        <option value="env">Envigado (Parque principal)</option>
        <option value="sab">Sabaneta (Parque principal)</option>
        <option value="name">{{T_BYNAME}}</option>
      </select>
    </label>
  </div>
</div>

<div class="list" id="list">{{STATIC_LIST}}</div>
{{SCHEDULE}}
<p class="note">{{NOTE}}</p>
</div>

<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<script>
const PAGE_LANG="{{LANG}}";const T={{TJS}};
const CENTERS={pob:[6.2096,-75.5681],cen:[6.2518,-75.5636],lau:[6.2456,-75.5916],bel:[6.2320,-75.6010],env:[6.1700,-75.5900],sab:[6.1515,-75.6160]};
const ZONES=[["Centro",6.2518,-75.5636],["El Poblado",6.2096,-75.5681],["Laureles",6.2456,-75.5916],["Belén",6.2320,-75.6010],["Robledo",6.2800,-75.5950],["Manrique",6.2690,-75.5540],["Aranjuez",6.2800,-75.5600],["Castilla",6.2920,-75.5750],["Buenos Aires",6.2380,-75.5540],["Guayabal",6.2180,-75.5880],["San Javier",6.2560,-75.6130],["La América",6.2520,-75.6010],["Villa Hermosa",6.2600,-75.5450],["Santa Cruz / Popular",6.2960,-75.5500],["Doce de Octubre",6.3020,-75.5860],["Santa Elena",6.2140,-75.4980],["San Antonio de Prado",6.1830,-75.6720],["San Cristóbal",6.2800,-75.6350],["Altavista",6.2080,-75.6230],["Envigado",6.1700,-75.5900],["Sabaneta",6.1515,-75.6160],["Itagüí",6.1720,-75.6110]];
const DAYS=T.days;
const DAYNAME=Object.fromEntries(T.days);
const NAMES={lunes:"L",martes:"M","miércoles":"Mc",miercoles:"Mc",jueves:"J",viernes:"V","sábado":"S",sabado:"S",domingo:"D"};
const ORDER=["L","M","Mc","J","V","S","D"];
function km(a,b,c,d){const R=6371,x=(c-a)*Math.PI/180,y=(d-b)*Math.PI/180*Math.cos((a+c)/2*Math.PI/180);return R*Math.sqrt(x*x+y*y)}
function esc(s){return String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}
function norm(s){return String(s??"").normalize("NFD").replace(/[̀-ͯ]/g,"").toLowerCase()}
function parseDays(h){
  const s=h.toLowerCase(), out=new Set();
  if(/todos los d|lunes a domingo|diario/.test(s)) ORDER.forEach(d=>out.add(d));
  const rng=/(lunes|martes|miércoles|miercoles|jueves|viernes|sábado|sabado)\s+a\s+(martes|miércoles|miercoles|jueves|viernes|sábado|sabado|domingo)/g; let m;
  while((m=rng.exec(s))){const a=ORDER.indexOf(NAMES[m[1]]),b=ORDER.indexOf(NAMES[m[2]]);for(let i=a;i<=b;i++)out.add(ORDER[i]);}
  for(const k in NAMES){if(new RegExp(k+"s?\\b").test(s))out.add(NAMES[k]);}
  const codeStyle=!/lunes|martes|mi[eé]rcoles|jueves|viernes|s[aá]bado|domingo|todos/i.test(h);
  for(const tok of h.split(/[\s;,.\-]+/)){if(/^(Mc|L|M|J|V|S|D|F)+$/.test(tok)&&(codeStyle||tok.length>=2)){for(const c of tok.match(/Mc|L|M|J|V|S|D|F/g)||[])if(c!=="F")out.add(c);}}
  return out;
}

const state={q:"",days:new Set(),fmt:"all",lang:"{{DEFAULT_FILTER}}",center:"pob",sel:null};
try{const s=JSON.parse(localStorage.getItem("aa-med")||"{}");if(s.center)state.center=s.center;if(s.lang&&PAGE_LANG==="es")state.lang=s.lang;}catch(e){}
document.getElementById("center").value=state.center;
document.getElementById("lang").querySelectorAll("button").forEach(b=>b.setAttribute("aria-pressed",b.dataset.v===state.lang));

const GKEY="{{GMAPS_KEY}}";
function dirUrl(g){
  const dest=(g.lang==="en"||g.lat==null)&&g.address?(g.address.replace(/ · /g,", ")+", Medellín, Antioquia, Colombia"):`${g.lat},${g.lng}`;
  return "https://www.google.com/maps/dir/?api=1&destination="+encodeURIComponent(dest);
}
function viewUrl(g){return g.map||(g.lat!=null?`https://www.google.com/maps/search/?api=1&query=${g.lat},${g.lng}`:"https://www.google.com/maps/search/?api=1&query="+encodeURIComponent((g.address||g.name)+", Medellín"));}
function infoHtml(grp){const g=grp[0];return `<div class="iw">${grp.map(x=>`<b>${esc(x.name)}</b><div class="t">${esc(x.hor)}</div>`).join("")}<div>${esc(g.address||"")}</div><a href="${esc(dirUrl(g))}" target="_blank" rel="noopener">${T.directions}</a><a href="#g-${g.i}" data-card="${g.i}">${T.details}</a></div>`;}
// Map adapter: Google Maps when a key is configured, otherwise MapLibre + OpenFreeMap.
const MAP={pins:{},
  init(){
    if(GKEY){return new Promise(res=>{window.__gm=()=>{this.g=new google.maps.Map(document.getElementById("map"),{center:{lat:6.225,lng:-75.585},zoom:12,mapTypeControl:false,streetViewControl:false,fullscreenControl:true,gestureHandling:"cooperative",clickableIcons:false});this.iw=new google.maps.InfoWindow();res();};
      const sc=document.createElement("script");sc.src=`https://maps.googleapis.com/maps/api/js?key=${GKEY}&callback=__gm&loading=async`;sc.async=true;sc.onerror=()=>{this.g=null;this.initLibre();res();};document.head.appendChild(sc);});}
    this.initLibre();return Promise.resolve();
  },
  initLibre(){
    this.m=new maplibregl.Map({container:"map",style:"https://tiles.openfreemap.org/styles/liberty",center:[-75.585,6.225],zoom:11.6,cooperativeGestures:true,attributionControl:{compact:true}});
    this.m.addControl(new maplibregl.NavigationControl({showCompass:false}),"top-right");
    this.m.addControl(new maplibregl.FullscreenControl(),"top-right");
    this.m.on("load",()=>{const a=document.querySelector(".maplibregl-ctrl-attrib");if(a)a.classList.remove("maplibregl-compact-show");});
    this.m.addControl(new maplibregl.GeolocateControl({positionOptions:{enableHighAccuracy:true}}),"top-right");
  },
  add(grp,onClick){const g=grp[0];const en=grp.some(x=>x.lang==="en");
    if(this.g){
      const mk=new google.maps.Marker({position:{lat:g.lat,lng:g.lng},map:this.g,title:grp.map(x=>x.name).join(" / "),zIndex:en?1000:1,
        icon:{path:google.maps.SymbolPath.CIRCLE,scale:en?9:7,fillColor:en?"#ea8600":"#1a73e8",fillOpacity:1,strokeColor:"#fff",strokeWeight:2}});
      mk.addListener("click",()=>{this.open(g);onClick(g);});this.pins[g.loc]=mk;return;
    }
    const el=document.createElement("div");el.className="pin "+(en?"en":"es");el.title=grp.map(x=>x.name).join(" / ");if(grp.length>1)el.dataset.n=grp.length;
    el.addEventListener("click",e=>{e.stopPropagation();this.open(g);onClick(g);});
    const mk=new maplibregl.Marker({element:el}).setLngLat([g.lng,g.lat]).addTo(this.m);if(en)el.style.zIndex=2;this.pins[g.loc]={mk,el};
  },
  dim(i,off){const p=this.pins[i];if(!p)return;if(this.g){p.setOpacity(off?.2:1);p.setClickable(!off);}else p.el.classList.toggle("dim",off);},
  sel(loc){if(this.g)return;for(const k in this.pins)this.pins[k].el.classList.toggle("sel",k===loc);},
  open(g){
    const all=LOCS[g.loc],vis=all.filter(x=>SHOWN.has(x.i)),grp=vis.length?vis:all;
    if(this.g){this.iw.setContent(infoHtml(grp));this.iw.open({map:this.g,anchor:this.pins[g.loc]});return;}
    if(this.pop)this.pop.remove();
    this.pop=new maplibregl.Popup({offset:14,maxWidth:"240px"}).setLngLat([g.lng,g.lat]).setHTML(infoHtml(grp)).addTo(this.m);
  },
  focus(g){if(this.g){this.g.panTo({lat:g.lat,lng:g.lng});this.g.setZoom(16);}else this.m.flyTo({center:[g.lng,g.lat],zoom:15.5});this.open(g);},
  fit(list){
    const pts=list.filter(g=>g.lat!=null&&g.lat>6.10&&g.lat<6.36&&g.lng>-75.72&&g.lng<-75.47);if(!pts.length)return;
    if(this.g){const b=new google.maps.LatLngBounds();pts.forEach(g=>b.extend({lat:g.lat,lng:g.lng}));this.g.fitBounds(b,40);if(pts.length===1)this.g.setZoom(15);return;}
    const b=new maplibregl.LngLatBounds();pts.forEach(g=>b.extend([g.lng,g.lat]));this.m.fitBounds(b,{padding:50,maxZoom:15,duration:600});
  }
};
document.getElementById("map").addEventListener("click",e=>{const a=e.target.closest("[data-card]");if(!a)return;e.preventDefault();const el=document.getElementById("g-"+a.dataset.card);if(el)el.scrollIntoView({behavior:"smooth",block:"center"});});
let ITEMS=[], LOCS={}, SHOWN=new Set();

function build(d){
  ITEMS=[];
  for(const g of d.es){
    ITEMS.push({...g,days:parseDays(g.schedule||""),virtualOnly:g.virtual&&/^(virtual|reuniones virtual)/i.test(g.schedule||""),
      zone:g.barrio||nearestZone(g),hor:g.schedule||"Horario no publicado"});
  }
  for(const g of [...d.en,...d.manual]){
    if(g.hidden)continue;
    const days=new Set(g.days||[]);
    const hor=(g.times||[]).map(t=>/^[A-Za-z]/.test(t)?t:((g.days||[]).map(x=>DAYNAME[x]).join(", ")+" "+t)).join("; ");
    ITEMS.push({...g,days,virtual:g.format!=="in-person",virtualOnly:g.format==="online",zone:nearestZone(g),hor,
      address:[g.place,g.address].filter(Boolean).join(" · ")});
  }
  ITEMS.forEach((g,i)=>g.i=i);
  for(const g of ITEMS){if(g.lat==null)continue;g.loc=g.lat.toFixed(4)+","+g.lng.toFixed(4);(LOCS[g.loc]=LOCS[g.loc]||[]).push(g);}
  for(const k in LOCS){const grp=LOCS[k].sort((a,b)=>(a.lang==="en"?0:1)-(b.lang==="en"?0:1));MAP.add(grp,g2=>{state.sel=g2.i;render(false);MAP.sel(g2.loc);const el=document.getElementById("g-"+g2.i);if(el&&window.innerWidth>700)el.scrollIntoView({behavior:"smooth",block:"nearest"});});}
  document.getElementById("upd").textContent=T.updated+new Date(d.updated).toLocaleDateString(T.locale,{day:"numeric",month:"short",year:"numeric"})+".";
}
function nearestZone(g){const txt=[g.name,g.address,g.place,...(g.notes||[])].join(" ").toLowerCase().replace(/centro comercial/g,"");for(const z of ZONES)if(txt.includes(z[0].toLowerCase()))return z[0];if(g.lat==null)return "";let best="",bd=1e9;for(const z of ZONES){const d=km(g.lat,g.lng,z[1],z[2]);if(d<bd){bd=d;best=z[0]}}return best}

const daysEl=document.getElementById("days");
DAYS.forEach(([k,l])=>{const b=document.createElement("button");b.className="chip";b.id="day-"+k;b.textContent=l;b.setAttribute("aria-pressed","false");b.onclick=()=>{const on=state.days.has(k);state.days.clear();if(!on)state.days.add(k);daysEl.querySelectorAll(".chip").forEach(x=>x.setAttribute("aria-pressed",state.days.has(x.id.slice(4))));render(true);};daysEl.appendChild(b);});
document.getElementById("q").oninput=e=>{state.q=e.target.value.trim();render(true)};
for(const id of ["fmt","lang"]){const el=document.getElementById(id);el.querySelectorAll("button").forEach(b=>b.onclick=()=>{state[id]=b.dataset.v;el.querySelectorAll("button").forEach(x=>x.setAttribute("aria-pressed",x===b));save();render(true);});}
document.getElementById("center").onchange=e=>{state.center=e.target.value;save();render(false);};
function save(){try{localStorage.setItem("aa-med",JSON.stringify({center:state.center,lang:state.lang}))}catch(x){}}

function render(refit){
  const c=CENTERS[state.center], nq=norm(state.q);
  let rows=ITEMS.filter(g=>{
    if(state.lang!=="all"&&g.lang!==state.lang)return false;
    if(nq&&!norm([g.name,g.address,g.detail,g.zone,g.topic,g.place].join(" ")).includes(nq))return false;
    if(state.fmt==="v"&&!g.virtual)return false;
    if(state.fmt==="p"&&g.virtualOnly)return false;
    for(const d of state.days)if(!g.days.has(d))return false;
    return true;});
  rows.forEach(g=>g.dist=(c&&g.lat!=null)?km(g.lat,g.lng,c[0],c[1]):null);
  if(c)rows.sort((a,b)=>(a.dist??1e9)-(b.dist??1e9)||a.name.localeCompare(b.name));else rows.sort((a,b)=>a.name.localeCompare(b.name));
  const shown=new Set(rows.map(g=>g.i));
  SHOWN=shown;for(const k in LOCS)MAP.dim(k,!LOCS[k].some(x=>shown.has(x.i)));
  if(refit)MAP.fit(rows);
  document.getElementById("count").textContent=rows.length+" / "+ITEMS.length;
  const list=document.getElementById("list");
  if(!rows.length){list.innerHTML='<p class="empty">'+T.empty+'</p>';return;}
  list.innerHTML=rows.map(g=>`<article class="card${g.i===state.sel?" sel":""}" id="g-${g.i}">
    <h2>${esc(g.name)}
      ${g.lang==="en"?`<span class="tag en">${T.tag.english}</span>`:''}
      ${g.topic?`<span class="tag o">${esc(T.topic[g.topic]||g.topic)}</span>`:''}
      ${g.type?`<span class="tag o">${T.tag[g.type]}</span>`:''}
      ${g.virtualOnly?`<span class="tag o">${T.tag.online}</span>`:(g.virtual?`<span class="tag o">${g.format==="hybrid"?T.tag.hybrid:T.tag.virtual}</span>`:'')}
      ${g.dist!=null?`<span class="dist">${g.dist.toFixed(1)} km</span>`:''}</h2>
    ${g.address?`<div class="addr"><a href="${esc(dirUrl(g))}" target="_blank" rel="noopener">${esc(g.address)}</a>${g.detail?" · "+esc(g.detail):""}</div>`:(g.detail?`<div class="addr">${esc(g.detail)}</div>`:"")}
    ${g.zone?`<div class="zone">${esc(g.zone)}</div>`:""}
    <div class="hor">${esc(g.hor)}</div>
    ${(g.notes&&g.notes.length)?`<div class="notes">${g.notes.map(esc).join("<br>")}</div>`:""}
    ${g.zoom?`<div class="notes">${esc(g.zoom)}</div>`:""}
    ${(g.contact||g.email)?`<div class="notes">${T.contact}: ${esc([g.contact,g.email].filter(Boolean).join(" · "))}</div>`:""}
    <div class="links">
      ${g.format!=="online"&&(g.lat!=null||g.address)?`<a class="dir" href="${esc(dirUrl(g))}" target="_blank" rel="noopener">${T.directions}</a>`:""}
      ${g.lat!=null?`<a href="#map" data-i="${g.i}" class="tomap">${T.onmap}</a>`:""}
      ${g.format!=="online"?`<a href="${esc(viewUrl(g))}" target="_blank" rel="noopener">Google Maps</a>`:""}
      ${g.url?`<a href="${esc(g.url)}" target="_blank" rel="noopener">${T.source}</a>`:""}
    </div>
  </article>`).join("");
  list.querySelectorAll(".tomap").forEach(a=>a.onclick=e=>{e.preventDefault();const g=ITEMS[+a.dataset.i];state.sel=g.i;MAP.sel(g.loc);document.getElementById("map").scrollIntoView({behavior:"smooth",block:"center"});setTimeout(()=>MAP.focus(g),350);});
}

fetch("{{DATA}}?"+Date.now()).then(r=>r.json()).then(async d=>{await MAP.init();build(d);render(true);}).catch(e=>{document.getElementById("count").textContent="";document.getElementById("list").innerHTML='<p class="empty">'+T.loadfail+'</p>';});
</script>
</body>
</html>
